name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  companion:
    name: PC companion (Windows / macOS / Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
          go vet ./...
          go test ./...
      - name: Build
        run: |
          set -e
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$3" ./cmd/lolmobil-companion
          }
          build windows amd64 "pkg/windows/LolMobil-Companion.exe"
          build darwin arm64 "pkg/macos-arm64/lolmobil-companion"
          build darwin amd64 "pkg/macos-x64/lolmobil-companion"
          build linux amd64 "pkg/linux-x64/lolmobil-companion"
          for d in pkg/*/; do
            cp -r pengu-plugin/LolMobil-Remote "$d"
            cp docs/LISEZMOI.txt "$d"
          done
          (cd pkg/windows && zip -qr ../../dist/LolMobil-Companion-windows-x64.zip .)
          (cd pkg/macos-arm64 && zip -qr ../../dist/LolMobil-Companion-macos-arm64.zip .)
          (cd pkg/macos-x64 && zip -qr ../../dist/LolMobil-Companion-macos-x64.zip .)
          (cd pkg/linux-x64 && tar czf ../../dist/LolMobil-Companion-linux-x64.tar.gz .)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: dist/*

  e2e:
    name: End-to-end test (mock client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: test/e2e
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run
        env:
          OUT: ${{ runner.temp }}/screenshots
          NODE_PATH: ${{ github.workspace }}/test/e2e/node_modules
        run: test/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.LOLMOBIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "LOLMOBIL_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the keystore from the repository secrets"
          else
            echo "Using the development keystore (android/app/dev-signing.keystore)"
          fi
      - name: Build APK
        working-directory: android
        env:
          LOLMOBIL_VERSION_NAME: ${{ env.VERSION }}
          LOLMOBIL_VERSION_CODE: ${{ github.run_number }}
          LOLMOBIL_KEYSTORE_PASSWORD: ${{ secrets.LOLMOBIL_KEYSTORE_PASSWORD }}
          LOLMOBIL_KEY_ALIAS: ${{ secrets.LOLMOBIL_KEY_ALIAS }}
          LOLMOBIL_KEY_PASSWORD: ${{ secrets.LOLMOBIL_KEY_PASSWORD }}
        run: |
          # Empty secrets must fall back to the development key defaults.
          [ -n "$LOLMOBIL_KEYSTORE_PASSWORD" ] || unset LOLMOBIL_KEYSTORE_PASSWORD
          [ -n "$LOLMOBIL_KEY_ALIAS" ] || unset LOLMOBIL_KEY_ALIAS
          [ -n "$LOLMOBIL_KEY_PASSWORD" ] || unset LOLMOBIL_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/LolMobil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/LolMobil.apk

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [companion, android, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LolMobil.apk
            dist/LolMobil-Companion-*
          generate_release_notes: true
